# Swing trader - mean-reversion scanner + walk-forward backtest.
# Unknown keys here raise a warning (llm-trader dropped them silently, which
# means you believe you swept a parameter and didn't).

data:
  start: "2021-01-01"
  end: "2026-09-18"
  feed: "iex"            # free tier. NOTE: IEX reports only its own share of volume.
  adjustment: "all"      # MUST be "all" - raw bars turn splits into phantom crashes.

walkforward:
  formation_days: 126    # ~6 months to measure range behaviour
  trade_days: 42         # ~2 months to trade it, strictly after formation
  step_days: 42

selection:
  halflife_min: 3.0      # "not for too long" - the core of the user's ask
  halflife_max: 15.0
  hurst_max: 0.5         # < 0.5 = anti-persistent = mean reverting
  max_abs_drift_t: 2.5   # HAC-corrected t-stat; reject "ranged while trending"
  min_amplitude_pct: 6.0 # round-trip swing must clear costs with room
  max_efficiency_ratio: 0.25 # outlier guard only; drift_t is the binding trend filter
  top_n: 8               # candidates carried into each trading window

cohorts:
  highvol:               # the RGTI species
    price_min: 5.0
    price_max: 50.0
    min_iex_dollar_vol: 2000000
    min_annual_vol: 0.60
  broad:
    price_min: 5.0
    price_max: 100000.0
    min_iex_dollar_vol: 2000000
    min_annual_vol: 0.0

strategy:
  z_window: 20
  z_entry: -2.0          # long when stretched below the mean
  z_exit: 0.0            # exit on reversion to mean
  time_stop_days: 20
  stop_pct: null         # null = no stop (the user's actual method); grid overrides
  # Overnight-gap quality filter. Research finding, NOT enabled live yet --
  # changing the strategy mid-experiment would contaminate the slippage
  # measurement the live run exists to produce. See RESULTS.md addendum 4.
  min_overnight_share: null   # 0.3 in backtest: Sharpe 0.95 -> 1.34
  overnight_window: 5
  # Duplicate-bet filter (RESULTS.md addendum 13). Drop a candidate whose 20d
  # returns correlate above this with a name already held / pending. Same rule
  # the night leg uses. null = off. On the uncapped book 0.7 gives Sharpe
  # 1.16 -> 1.33, maxDD -15.3% -> -10.3%, and beats a matched random-drop
  # control (rm 28 vs 12). Applies to BOTH the backtest and the live swing
  # executor (live/executor.decide), so setting it changes what trades.
  max_corr: null
  corr_window: 20

portfolio:
  equity: 100000.0
  max_positions: 8
  slippage_bps: 20.0     # per side. high-vol smallcaps are not free to trade.
  commission_per_share: 0.0
  # Capital deployment. Mean concurrent positions is 1.29 against 8 slots, so
  # equal-weighting on the CAP leaves 86% of position-days idle. position_pct
  # sizes against typical usage; max_gross_pct bounds the tail.
  position_pct: null     # null -> 1/max_positions (12.5%). 0.25 doubles exposure.
  max_gross_pct: 100.0   # hard cap on total exposure; refuses, never levers
  cash_yield_annual: 0.0 # flat fallback; prefer --cash BIL for the real rate path

# Daily-cadence book (RESULTS.md addendum 6). Separate executor
# (scripts/daily.py), separate state (state/book-daily.json), virtual equity
# that compounds from its own fills only. Never trades a symbol the swing book
# holds, and vice versa.
daily:
  enabled: true
  # The REAL-MONEY switch is NOT here: it is DAILY_LIVE=on|off in .env, set by
  # `make daily-live-on` / `make daily-live-off`. (.env survives `make pull`;
  # this file is reset by it.) Live keys: ALPACA_LIVE_API_KEY / _SECRET_KEY.
  accounts: ["paper"]
  live_broker: schwab            # real money: schwab (paper always runs on Alpaca)
  live_capital: null             # null = all FREE equity (cash + the bot's own positions);
                                 # a number caps the bot at that many dollars
  live_min_capital: 500.0        # below this the live book makes no new buys
  quote_source: auto             # 15:40 scan prices: Schwab real-time if logged in, else Alpaca
  daytrade_mode: auto            # auto = intraday leg live once equity >= daytrade_min_equity; off = never
  start_equity: 3000.0           # paper book's virtual start. live uses the real balance
  # PDT rule retired 2026-06-04 (FINRA Rule 4210; Alpaca 06-04, Schwab 06-08).
  # Floor is now Reg T's $2,000 margin minimum.
  daytrade_min_equity: 2000.0
  # IBS leg: top-3 of these by 12-1 month momentum (re-ranked monthly), then
  # IBS < 0.2. Was a hand-picked ["QQQ","SMH","XLK"]; the rule is the honest
  # version of that choice (RESULTS.md addendum 7).
  ibs_symbols: ["SPY", "QQQ", "IWM", "DIA", "MDY", "XLK", "XLF", "XLE", "XLV",
                "XLI", "XLY", "XLP", "XLU", "XLB", "SMH", "XBI", "EEM", "EFA"]
  ibs_top_k: 3
  ibs_max: 0.2
  ibs_cash_symbol: SGOV          # idle IBS half parks in T-bills (+~1.3%/yr)
  ibs_weight: 0.5                # 0.5 + 0.5 = 1x, no margin. 1.0 + 1.0 = 2x overnight:
  night_weight: 0.5              #   backtest 21.8% CAGR/-11% DD -> 44.5%/-22%
  night_max_name_pct: 0.10
  night_day_ret_max: -0.08
  night_ibs_max: 0.10
  night_price_min: 5.0
  night_price_max: 2000.0
  night_adv_min: 10000000.0
  night_vol_min: 0.60            # skip quiet names (a -8% day there is news, not overreaction)
  night_crowd_n: 30              # >30 signals = market-wide selloff: exposure x 30/n
  night_max_corr: 0.9            # 20d-return correlation above this = same bet: keep the most beaten one
  noise_symbol: QQQ
  noise_alt_symbol: QQQM         # used on days the IBS leg holds QQQ
  noise_lookback: 14
  noise_target_vol: 0.02
  noise_max_lev: 3.5
