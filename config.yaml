# Swing trader - mean-reversion scanner + walk-forward backtest.
# Unknown keys here raise a warning (llm-trader dropped them silently, which
# means you believe you swept a parameter and didn't).

data:
  start: "2021-01-01"
  end: "2026-09-18"
  feed: "iex"            # free tier. NOTE: IEX reports only its own share of volume.
  adjustment: "all"      # MUST be "all" - raw bars turn splits into phantom crashes.

walkforward:
  formation_days: 126    # ~6 months to measure range behaviour
  trade_days: 42         # ~2 months to trade it, strictly after formation
  step_days: 42

selection:
  halflife_min: 3.0      # "not for too long" - the core of the user's ask
  halflife_max: 15.0
  hurst_max: 0.5         # < 0.5 = anti-persistent = mean reverting
  max_abs_drift_t: 2.5   # HAC-corrected t-stat; reject "ranged while trending"
  min_amplitude_pct: 6.0 # round-trip swing must clear costs with room
  max_efficiency_ratio: 0.25 # outlier guard only; drift_t is the binding trend filter
  top_n: 8               # candidates carried into each trading window

cohorts:
  highvol:               # the RGTI species
    price_min: 5.0
    price_max: 50.0
    min_iex_dollar_vol: 2000000
    min_annual_vol: 0.60
  broad:
    price_min: 5.0
    price_max: 100000.0
    min_iex_dollar_vol: 2000000
    min_annual_vol: 0.0

strategy:
  z_window: 20
  z_entry: -2.0          # long when stretched below the mean
  z_exit: 0.0            # exit on reversion to mean
  time_stop_days: 20
  stop_pct: null         # null = no stop (the user's actual method); grid overrides
  # Overnight-gap quality filter. Research finding, NOT enabled live yet --
  # changing the strategy mid-experiment would contaminate the slippage
  # measurement the live run exists to produce. See RESULTS.md addendum 4.
  min_overnight_share: null   # 0.3 in backtest: Sharpe 0.95 -> 1.34
  overnight_window: 5
  # Duplicate-bet filter (RESULTS.md addendum 13). Drop a candidate whose 20d
  # returns correlate above this with a name already held / pending. Same rule
  # the night leg uses. null = off. On the uncapped book 0.7 gives Sharpe
  # 1.16 -> 1.33, maxDD -15.3% -> -10.3%, and beats a matched random-drop
  # control (rm 28 vs 12). Applies to BOTH the backtest and the live swing
  # executor (live/executor.decide), so setting it changes what trades.
  max_corr: null
  corr_window: 20

portfolio:
  equity: 100000.0
  max_positions: 8
  slippage_bps: 20.0     # per side. high-vol smallcaps are not free to trade.
  commission_per_share: 0.0
  # Capital deployment. Mean concurrent positions is 1.29 against 8 slots, so
  # equal-weighting on the CAP leaves 86% of position-days idle. position_pct
  # sizes against typical usage; max_gross_pct bounds the tail.
  position_pct: null     # null -> 1/max_positions (12.5%). 0.25 doubles exposure.
  max_gross_pct: 100.0   # hard cap on total exposure; refuses, never levers
  cash_yield_annual: 0.0 # flat fallback; prefer --cash BIL for the real rate path

# Daily-cadence book (RESULTS.md addendum 6). Separate executor
# (scripts/daily.py), separate state (state/book-daily.json), virtual equity
# that compounds from its own fills only. Never trades a symbol the swing book
# holds, and vice versa.
daily:
  enabled: true
  # The REAL-MONEY switch is NOT here: it is DAILY_LIVE=on|off in .env, set by
  # `make daily-live-on` / `make daily-live-off`. (.env survives `make pull`;
  # this file is reset by it.) Live keys: ALPACA_LIVE_API_KEY / _SECRET_KEY.
  accounts: ["paper"]
  live_broker: schwab            # real money: schwab (paper always runs on Alpaca)
  live_capital: null             # null = all FREE equity (cash + the bot's own positions);
                                 # a number caps the bot at that many dollars
  live_min_capital: 500.0        # below this the live book makes no new buys
  night_probe_max_usd: 150.0     # real money: a night pick that rounds to 0 shares is bought as 1 share
                                 # if it costs <= this, so the open-sell cost sample is not only cheap names
  quote_source: auto             # 15:40 scan prices: Schwab real-time if logged in, else Alpaca
  daytrade_mode: auto            # auto = intraday leg live while the ACCOUNT holds >= daytrade_min_equity; off = never
  start_equity: 3000.0           # paper book's virtual start. live uses the real balance
  # PDT rule retired 2026-06-04 (FINRA Rule 4210; Alpaca 06-04, Schwab 06-08).
  # Floor is now Reg T's $2,000 margin minimum.
  daytrade_min_equity: 2000.0
  # IBS leg: top-3 of these by 12-1 month momentum (re-ranked monthly), then
  # IBS < 0.2. Was a hand-picked ["QQQ","SMH","XLK"]; the rule is the honest
  # version of that choice (RESULTS.md addendum 7).
  ibs_symbols: ["SPY", "QQQ", "IWM", "DIA", "MDY", "XLK", "XLF", "XLE", "XLV",
                "XLI", "XLY", "XLP", "XLU", "XLB", "SMH", "XBI", "EEM", "EFA"]
  ibs_top_k: 3
  ibs_max: 0.2
  ibs_cash_symbol: SGOV          # idle IBS half parks in T-bills (+~1.3%/yr)
  ibs_weight: 0.5                # 0.5 + 0.5 = 1x, no margin. 1.0 + 1.0 = 2x overnight:
  night_weight: 0.5              #   backtest 21.8% CAGR/-11% DD -> 44.5%/-22%
  roth_cash_ira: false           # Round 17 Studies AL/AQ: on a plain cash IRA (no limited margin)
                                 # run the GFV-safe IBS+night legs, NO intraday leg. 19.0%/yr at
                                 # 5bp/side night cost, 22.0% at 2.5bp/side (t 3.06, P(DD50) 0%, SHADOW).
                                 # Gate: live night cost <= ~3bp/side (crossover 3.7bp/side on official
                                 # auction prints, Round 19 AW; 5.4 on vendor opens); else run IBS-only
                                 # (17.9% at tier_hi). Measured live ~0bp. Off = need ROTH_LIMITED_MARGIN.
  lever_weight: null             # 0.65 = both legs -> 0.65 (1.3x overnight) once signals.lever_ok passes
                                 # (50 night exits <= 10bp/side). null = never. Off 2026-09-29: the gate
                                 # proves costs, not edge; revisit at ~100 live night trades (NEXT.md)
  night_max_name_pct: 0.10
  night_day_ret_max: -0.08
  night_ibs_max: 0.10
  night_price_min: 5.0
  night_price_max: 2000.0
  night_adv_min: 10000000.0
  night_vol_min: 0.60            # skip quiet names (a -8% day there is news, not overreaction)
  night_crowd_n: 30              # >30 signals = market-wide selloff: exposure x 30/n
  night_max_corr: 0.7            # 20d-return correlation above this = same bet: keep the most beaten one.
                                 # 0.9 -> 0.7 (addendum 18): five oil producers were one bet on 2020-03-06
  night_weekend_scale: 0.5       # half size when held over a weekend/holiday (addendum 18: COVID crash
                                 # book -17% -> -4% with the dedupe; 2021-26 Sharpe up, not down)
  night_tilt_k: 0.25             # weight deeper drops more (addendum 16; fitted 2021-23, held out 2024-26). 0 = equal
  night_tilt_model: v1           # v2 adds yesterday's return: replay +$23k, but borderline (addendum 23)
  night_tilt_tow: false          # Round 19 AU3 tug-of-war tilt, SHADOW: logged only. Gate/kill rule: study_au_tow.md
  news_judge: shadow             # Round 23 BA: Claude labels each night pick's drop fundamental/liquidity after
                                 # the orders are placed; logged to state/news-judge.jsonl, never trades. off = disable.
                                 # Needs OPENCODE_API_KEY in .env (no key = silently off). <= 20 calls/night,
                                 # pennies a month on OpenCode Go. Claude: provider anthropic + ANTHROPIC_API_KEY
  news_judge_provider: opencode-go
  news_judge_model: deepseek-v4-flash
  news_judge_effort: low
  news_judge_max_calls: 20
  insider_day: shadow            # Round 31 ID3: insider-purchase session, SHADOW ONLY (make insider-shadow, weekdays
                                 # before 09:00 ET). Gate: 300 scored trades, mean net > 0, t >= 2 (study_id_insider_day.md)
  night_impact_y: null           # impact cap (Study X): order <= ADV (edge/(3 Y sigma))^2. null = off until
                                 # `make review` section 8 measures Y; 4 is the robust choice (Study X), 1-2
                                 # if fills show low impact. At ~$2k it binds only on ~300%-vol names.
  night_impact_edge_bps: 22.0    # the leg's weighted gross (24.6bp) minus live cost, rounded down
  noise_symbol: QQQ
  noise_alt_symbol: QQQM         # used on days the IBS leg holds QQQ
  # QQQ + SMH split the intraday budget equally (RESULTS.md addendum 16:
  # Sharpe 1.76 -> 1.89 on the live-code simulator, both halves). SMH trades
  # SOXX on days the IBS leg holds SMH.
  noise_extra: {SMH: SOXX}
  # Conviction day trade (RESULTS.md addendum 19): trades only on STRONG first
  # breakouts in TQQQ (~70 days/yr). Book 40.7% -> 49.8%/yr, Sharpe 1.98 -> 1.98.
  # shadow = decides and logs, places nothing. Set auto once the regular
  # intraday leg has a week of clean live fills.
  conviction_weight: 0.5
  conviction_mode: shadow
  conviction_margin: 0.75        # house margin on TQQQ/SQQQ (3 x 25%); shrinks the intraday cap
  # Oversold overnight (RESULTS.md addendum 27): SPY/QQQ after 3 down closes or RSI(2) < 10,
  # bought at the close with the IBS leg's idle money, sold at the next open. V7 47.5 -> 49.9%/yr,
  # Sharpe 1.99 -> 2.04, but post-hoc: shadow only (logs `[oversold]`, scores itself, no orders).
  oversold_mode: shadow          # on the Roth it also logs A2: all idle overnight money (add. 31)
  # Research-program shadows: off | shadow. shadow = log + self-score, NO orders, no sizing change.
  fomc_filler_mode: shadow       # F3: QQQ close->open on spare night cash, FOMC eves, taxable only (add. 33)
  roth_night_cash_log: shadow    # Roth 15:40 `[roth-cash]` requested vs funded night notional, M2L (add. 31)
  lever_g1_log: shadow           # `[lever-g1]` day-clustered 95% UB gate beside `[lever]`; lever_ok unchanged (add. 38)
  wash_guard_mode: shadow        # `[wash-guard]` what the Roth-first G4s guard would change vs the live one (add. 31)
  # LIVE wash guard between the two real-money books: symmetric | roth_first.
  # Only matters once DAILY_ROTH=on; addendum 31/39; symmetric = old behavior.
  # roth_first: the Roth runs first each phase, its night leg skips only taxable
  # loss sales (30d) + names the taxable book holds/has orders in, its IBS leg trades
  # different-index look-alikes (XLK->VGT, SMH->SOXX, sector SPDR->Vanguard). Logs `[wash]`.
  wash_guard: roth_first
  noise_lookback: 14
  noise_target_vol: 0.02
  noise_max_lev: 3.5
  # Experimental growth profile (RESULTS.md addendum 22). Opt-in, real-money
  # brokerage book only: DAILY_LIVE_PROFILE=aggressive in .env. History ~71%/yr,
  # maxDD -21%; if the edge halves at pessimistic costs ~22%/yr (shipped ~18%)
  # with a 68% chance of a >30% drawdown and 9% of >50% within 5 years.
  profiles:
    # Addendum 29: at measured live costs (~0bp/side; 3bp used) a 15% name cap is the best
    # Sharpe of every profile tested (2.42 vs 2.33), leverage still arrives only through the
    # gate. EH 34% vs 25%/yr, P(DD>30%) in 5y 32% vs 11%. At tier_hi costs it is worse
    # (Sharpe 1.67 vs 1.73): use only while `make review` 2b keeps open sells near 0bp.
    moderate:
      night_max_name_pct: 0.15
    # Addendum 39 (raw prices, after 35% tax): the 15% cap at 1.0x is the best stressed profile
    # (edge-halves tier_hi 9.3%/yr after tax vs 9.1 at 1.3x; P(DD>50%) in 5y 1-2% vs 5-9%).
    # `moderate` levers only while the base lever_weight is set (null since 2026-09-29).
    moderate10:
      night_max_name_pct: 0.15
      lever_weight: null
    # moderate10 + the TQQQ conviction trade live (add. 19/39: +6pp/yr on raw prices). Switch on
    # only after `make review` section 7 shows ~5 clean live intraday days.
    moderate10c:
      night_max_name_pct: 0.15
      lever_weight: null
      conviction_mode: auto
    aggressive:
      ibs_weight: 0.65           # 1.3x overnight, ungated
      night_weight: 0.65
      lever_weight: null
      night_max_name_pct: 0.20
      conviction_weight: 0.5
      conviction_mode: auto
      noise_max_lev: 0.6         # the tested cap (2x account: 2 x (1 - 0.5 x 0.75) - 0.65)

# Leap book (RESULTS.md addendum 24): SHADOW ONLY, off. SOXL opening-range
# breakout (fragile: ~0 in 2016-20, dies at 10bp/side) and SOXL IBS < 0.2
# (robust). Neither 5x's in a year: P(5x in 12 months) <= 7%, ~4 years median.
leap:
  enabled: false
  mode: shadow
  symbol: SOXL
  inverse_symbol: SOXS
  orb_minutes: 15
  ibs_max: 0.2
